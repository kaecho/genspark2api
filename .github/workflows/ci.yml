name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Byte-compile the scripts
        run: python -m py_compile genspark2api.py gs_login.py gs_export.py

      - name: Install and import the runtime dependencies
        run: |
          pip install --no-cache-dir -r requirements.txt
          python -c "import fastapi, uvicorn, curl_cffi; print('deps ok')"

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the image without pushing
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
